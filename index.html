    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-image: url("https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/51bf9a1b-c4fc-42b1-abe6-945af52780da/OBMC+MOsNTESSORI+AN+1+-+AY+2026+FA.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-top: 140px;
       }
        h1 {
            font-weight: bold;
        }

        h5{
            font-size: xx-large;
            font-weight:400;
            color: rgb(248, 249, 250);
        }
        input[type="text"], input[type="email"], select {
            border: 1px solid #ced4da;
            border-radius: 5px;
            padding: 5px 10px;
            width: 100%;
        }

        .headertext{
          text-align: center;
          color:white;
        }

        section{
            margin: 0 auto;
            text-align: justify;
            border-radius: 5px;
            background-color: rgba(253, 254, 255, 0.95);
            padding: 30px;
            max-width: 900px;
            box-shadow: 0px 10px 20px 2px rgb(2, 2, 2);
            margin-bottom: 25px;
            
        }
        .form-row{
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .form-group{
            display: flex;
            gap: 8px;
            width: 100%;
        }
        button{
            width: 100%;
            border-radius: 10%;
        }
        footer{
            text-align: center;
            background: white;
            box-shadow: 0px 10px 20px 2px rgb(2, 2, 2);
                padding: 15px 0;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-white fixed-top" style="padding: 0;">
  <div class="container-fluid">
    <a class="navbar-brand" href=""><img src="https://play-lh.googleusercontent.com/OwiIxkQhT3F-zukYQJGQKTDaJrj0ub-gku-nn2vEOszKWHMLa87D060lRIVZxQYMzAjRpAHb4wM8Iix9Tn_gfA" alt="obmclogo" class="rounded-circle" style="height: 90px; width: 90px"></a>

      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link text-muted" href="javascript:void(0)">Enroll Now</a>
        </li>
      </ul>
      <form class="d-flex">
        <a href="https://obmontessori.orangeapps.ph/landing/obmontessori/">
          <button class="btn btn-warning" type="button">My Portal</button></a>
      </form>

<div class="headertext">
  <a class="navbar-brand" href=""><img src="https://play-lh.googleusercontent.com/OwiIxkQhT3F-zukYQJGQKTDaJrj0ub-gku-nn2vEOszKWHMLa87D060lRIVZxQYMzAjRpAHb4wM8Iix9Tn_gfA" alt="obmclogo" class="rounded-circle" style="height: 90px; width: 90px"></a>
  <h5>OBMC Student Enrollment Form</h5>
  <a>Fill out the form below.</a>
</div>

<br>

<div class="container">
    <div class="row">
        <div class="col-12">
            <section>
                <h3>Student Information</h3>
                <form>
                  <div class="form-row">
                    <div class="form-group">
                        <label for="fname" class="form-label">First Name:</label><br>
                        <input type="text" id="fname" name="fname" class="form-control-custom" placeholder="Enter First Name" required> 
                    </div>
                     <br>
                    <div class="form-group">
                        <label for="lname" class="form-label">Last Name:</label><br>
                        <input type="text" id="fname" name="fname" class="form-control-custom" placeholder="Enter Last Name" required> 
                    </div>
                  </div>
                    <br>
                  <div class="form-row">
                        <div class="form-group">
                        <label for="gender">Gender:</label>
                        <select id="gender" name="gender">
                        <option value="" disabled selected hidden>Select...</option>
                        <option value="1">Female</option>
                        <option value="2">Male</option>
                        </select>
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="gradelevel" >Grade Level:</label>
                        <select id="gradelevel" name="gradelevel">
                        <option value="" disabled selected hidden>Select...</option>
                        <option value="1">CASA</option>
                        <option value="2">Grade 1</option>
                        <option value="3">Grade 2</option>
                        <option value="4">Grade 3</option>
                        <option value="5">Grade 4</option>
                        <option value="6">Grade 5</option>
                        <option value="7">Grade 6</option>
                        <option value="8">Grade 7</option>
                        <option value="9">Grade 8</option>
                        <option value="10">Grade 9</option>
                        <option value="11">Grade 10</option>
                        <option value="12">Grade 11</option>
                        <option value="13">Grade 12</option>
                        </select>
                    </div>
                  </div>
                    <br>
                <h3>Contact Details</h3>
                  <div class="form-row">
                    <div class="form-group">
                        <label for="email" class="form-label">Your Email:</label><br>
                        <input type="email" id="email" name="email" class="form-control-custom" placeholder="student@example.com" required> 
                    </div>
                    <br>
                    <div class="form-group">
                        <label for="email" class="form-label">Contact Number:</label><br>
                        <input type="email" id="email" name="email" class="form-control-custom" placeholder="0912-345-6789" required> 
                    </div>
                  </div>
                    <br>
                    <h3>Other Information</h3>
                    <div>
                     <label for="areasofinterest">What are you interested in?:</label><br>
                      <input type="checkbox" id="skills1" name="sills1" value="genre">    
                     <label for="skills1">Online</label>
                      <input type="checkbox" id="skills2" name="skills2" value="genre">    
                     <label for="skills2">Face-to-Face</label>
                    </div>
                    <br>
                    <div>          
                     <input type="checkbox" id="skills3" name="skills3" value="genre">          
                     <label for="skills3">I confirm that the information provided is true and complete</label>
                    </div>
                    <br>    
                    <button class="btn btn-primary" type="submit">Submit Enrollment</button>
                </form>
            </section>
        </div>
    </div>
</div>
